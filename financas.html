<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finanças</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0F1623; --green:#16A34A; --red:#DC2626; --blue:#2563EB;
  --bg:#F1F5F9; --card:#FFFFFF; --text:#0F1623; --muted:#64748B;
  --border:#E2E8F0; --r-lg:16px; --r-sm:10px; --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px;line-height:1.4}
.wrap{max-width:640px;margin:0 auto}
/* Header */
header{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff}
.header-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.header-in .spacer{flex:1}
.btn-reset{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
/* Banner */
#banner{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--navy);color:#fff;text-align:center;padding:16px;font-weight:700;font-size:18px;letter-spacing:1px;transition:opacity .8s;border-bottom:3px solid #fff}
/* Toast */
#toast{position:fixed;top:-100px;left:50%;transform:translateX(-50%);z-index:300;background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:top .35s;font-size:14px;max-width:90%}
#toast.show{top:16px}
/* Layout */
main{padding:16px}
.tab-page{display:none}
.tab-page.active{display:block}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
h2.page-title{font-size:20px;margin-bottom:14px}
.section-title{font-size:15px;font-weight:700;margin:18px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
/* Hero */
.hero{background:var(--navy);color:#fff;border-radius:var(--r-lg);padding:22px;margin-bottom:14px}
.hero .label{font-size:14px;opacity:.8}
.hero .big{font-size:52px;font-weight:800;line-height:1.1;margin:6px 0}
.hero .sub{font-size:13px;opacity:.7}
.pos{color:var(--green)} .neg{color:var(--red)}
/* Stat grid */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:12px;text-align:center}
.stat .v{font-size:18px;font-weight:700}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
/* Buttons */
.btn{display:block;width:100%;border:none;border-radius:var(--r-sm);padding:15px;font-size:16px;font-weight:700;cursor:pointer}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-add{background:var(--blue);color:#fff;border:none;border-radius:var(--r-sm);padding:12px;font-size:15px;font-weight:600;width:100%;cursor:pointer;margin-top:8px}
/* Rows / list */
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .subt{font-size:12px;color:var(--muted)}
.row .val{font-weight:700;font-size:15px;white-space:nowrap}
.badge{display:inline-block;background:var(--border);color:var(--muted);font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
.badge.green{background:#DCFCE7;color:var(--green)}
.badge.red{background:#FEE2E2;color:var(--red)}
.badge.blue{background:#DBEAFE;color:var(--blue)}
.del{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:4px 6px;opacity:.7}
.muted{color:var(--muted)}
.totals{display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px}
.summary-card{display:flex;justify-content:space-between;align-items:center}
.summary-card .v{font-size:24px;font-weight:800}
/* progress */
.prog{height:6px;background:var(--border);border-radius:999px;overflow:hidden;margin-top:6px}
.prog>div{height:100%;background:var(--blue)}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:60}
.nav-in{max-width:640px;margin:0 auto;display:flex}
.nav-in button{flex:1;background:none;border:none;padding:8px 2px 10px;cursor:pointer;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-in button .ic{font-size:20px}
.nav-in button.active{color:var(--blue)}
/* modal */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none}
.backdrop.open{display:block}
.modal{position:fixed;left:0;right:0;bottom:0;z-index:101;background:#fff;border-radius:18px 18px 0 0;padding:20px;max-width:640px;margin:0 auto;transform:translateY(100%);transition:transform .3s}
.modal.open{transform:translateY(0)}
.modal h3{margin-bottom:14px;font-size:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:16px;background:#fff;font-family:inherit}
.toggle{display:flex;gap:8px}
.toggle button{flex:1;padding:12px;border:1px solid var(--border);background:#fff;border-radius:var(--r-sm);font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.toggle button.on-out{background:var(--red);color:#fff;border-color:var(--red)}
.toggle button.on-in{background:var(--green);color:#fff;border-color:var(--green)}
.toggle button.on-blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.modal-actions{display:flex;gap:10px;margin-top:8px}
.modal-actions button{flex:1;padding:14px;border:none;border-radius:var(--r-sm);font-size:15px;font-weight:700;cursor:pointer}
.btn-cancel{background:var(--border);color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:24px 0;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
.chart-box{position:relative;height:240px}
/* Visão Geral */
.vg-day{background:var(--card);border-radius:var(--r-sm);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.vg-today{border:2px solid var(--blue)}
.vg-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:4px}
.vg-date{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.vg-totals{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.vg-net{font-size:12px;color:var(--muted)}
.vg-body{padding:8px 12px;display:flex;flex-direction:column;gap:5px}
.vg-item{font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vg-item b{margin-left:auto;white-space:nowrap}
.vg-item.green{color:var(--green)}
.vg-item.red{color:var(--red)}
</style>
</head>

<script>
/* ============ DATA LAYER (localStorage) ============ */
const KEY='financas_v1';
const uid=()=> (crypto.randomUUID? crypto.randomUUID() : 'id'+Date.now()+Math.random().toString(16).slice(2));

function seed(){
  const fixas=[
    ['Financiamento',2269,10],['Psicólogo',1920,15],['Condomínio',633,5],['Cartão',838,22],
    ['Plano de saúde',250,1],['Contador',200,10],['Gympass',140,1],['Contas Mãe',128,5],
    ['Claude',115,1],['Basquete FFLCH',60,15],['Apple',50,1],['Nubank',50,1]
  ].map(([nome,valor,dia])=>({id:uid(),nome,valor,dia_vencimento:dia,ativo:true}));

  const parceladas=[
    ['Sousmiles',388,16,18],['Moletom Corinthians',250,2,2],['Lacoste',200,2,2]
  ].map(([nome,vp,pa,tp])=>({id:uid(),nome,valor_parcela:vp,parcela_atual:pa,total_parcelas:tp,ativo:true}));

  const transacoes=[
    {id:uid(),data:'2026-06-10',tipo:'entrada',valor:10000,descricao:'Salário Inpress',categoria:'Salário',forma_pagamento:'dinheiro_pix'}
  ];

  const monthly_summary=[
    [1,2026,18000,2950],[2,2026,18000,4200],[3,2026,20500,6364],
    [4,2026,23212,5760],[5,2026,32118,20168],[6,2026,26500,7500]
  ].map(([mes,ano,et,ec])=>({id:uid(),mes,ano,entrada_total:et,economizado:ec,imposto_pago:null,fatura_cartao:null}));

  const savings=[
    ['2026-01-31',2950,'Economia de Janeiro'],['2026-02-28',4200,'Economia de Fevereiro'],
    ['2026-03-31',6364,'Economia de Março'],['2026-04-30',5760,'Economia de Abril'],
    ['2026-05-22',20168,'Economia de Maio'],['2026-06-22',7500,'Economia de Junho']
  ].map(([data,valor,desc])=>({id:uid(),data,tipo:'aporte',valor,descricao:desc}));

  return {fixas,parceladas,transacoes,monthly_summary,savings};
}

let DB=null;
function loadDB(){
  const raw=localStorage.getItem(KEY);
  if(raw){ try{ DB=JSON.parse(raw); }catch(e){ DB=seed(); saveDB(); } }
  else { DB=seed(); saveDB(); }
}
function saveDB(){ localStorage.setItem(KEY,JSON.stringify(DB)); }
function resetData(){
  if(confirm('Apagar todos os dados e restaurar os valores iniciais?')){
    DB=seed(); saveDB(); renderAll(); toast('Dados restaurados');
  }
}
// collection helpers
const getFixas=()=>DB.fixas;
const getParceladas=()=>DB.parceladas;
const getTransacoes=()=>DB.transacoes;
const getSummary=()=>DB.monthly_summary;
const getSavings=()=>DB.savings;

/* ============ HELPERS ============ */
function brl(v){ if(v===null||v===undefined||v==='') return '—'; return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fdate(d){ return new Date(d+'T12:00:00').toLocaleDateString('pt-BR'); }
function todayISO(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
function iso(y,m,d){ return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }

/* ===== Financial cycle: day 23 -> day 22 (credit card closing day = 22) ===== */
function currentCycleRange(){
  const n=new Date(); const y=n.getFullYear(), m=n.getMonth()+1, d=n.getDate();
  let firstY,firstM,lastY,lastM;
  if(d>=23){ firstY=y; firstM=m; lastM=m+1; lastY=y; if(lastM>12){lastM=1;lastY=y+1;} }
  else { lastY=y; lastM=m; firstM=m-1; firstY=y; if(firstM<1){firstM=12;firstY=y-1;} }
  return { first: iso(firstY,firstM,23), last: iso(lastY,lastM,22) };
}
function daysRemainingInCycle(){
  const {last}=currentCycleRange();
  const t=new Date(todayISO()+'T12:00:00');
  const l=new Date(last+'T12:00:00');
  const diff=Math.floor((l-t)/86400000)+1; // inclusive of the 22nd
  return Math.max(1,diff);
}
function inCurrentCycle(d){ const {first,last}=currentCycleRange(); return d>=first && d<=last; }

/* ============ MONEY CALCULATIONS ============ */
function cycleTransactions(){ return getTransacoes().filter(t=>inCurrentCycle(t.data)); }

function calcSaldo(){
  const tx=cycleTransactions();
  const entradas=tx.filter(t=>t.tipo==='entrada').reduce((s,t)=>s+t.valor,0);
  const saidas=tx.filter(t=>t.tipo==='saida').reduce((s,t)=>s+t.valor,0);
  // Excluímos a conta fixa "Cartão" do cálculo: as parcelas ativas já somam a
  // fatura do cartão, então contar as duas faria dupla contagem do mesmo valor.
  const fixasTotal=getFixas().filter(f=>f.ativo && f.nome!=='Cartão').reduce((s,f)=>s+f.valor,0);
  const parcelasTotal=getParceladas().filter(p=>p.ativo).reduce((s,p)=>s+p.valor_parcela,0);
  return entradas - saidas - fixasTotal - parcelasTotal;
}

/* ============ RENDERING ============ */
function renderAll(){ renderInicio(); renderLancamentos(); renderFixas(); renderParceladas(); renderPatrimonio(); renderResumo(); renderVisao(); }

/* ============ VISÃO GERAL ============ */
function renderVisao(){
  const el=document.getElementById('tab-visao');
  const {first,last}=currentCycleRange();
  const today_=todayISO();

  // Montar todos os dias do ciclo
  const days=[];
  let d=new Date(first+'T12:00:00');
  const endD=new Date(last+'T12:00:00');
  while(d<=endD){ days.push(d.toISOString().slice(0,10)); d=new Date(d.getTime()+86400000); }

  // Fixas (sem Cartão) — distribuídas pelo dia de vencimento ou dia 1
  const fixas=getFixas().filter(f=>f.ativo && f.nome!=='Cartão');
  // Parcelas ativas
  const parcelas=DB.parceladas.filter(p=>Number(p.parcela_atual)<=Number(p.total_parcelas));
  // Transações do ciclo
  const txs=DB.transacoes.filter(t=>t.data>=first && t.data<=last);

  // Para cada dia, calcular entradas e saídas
  const byDay=days.map(iso=>{
    const entradas=txs.filter(t=>t.data===iso && t.tipo==='entrada');
    const saidasTx=txs.filter(t=>t.data===iso && t.tipo==='saida');
    // Fixas com vencimento nesse dia
    const dom=parseInt(iso.slice(8));
    const saidasFixas=fixas.filter(f=>(f.dia_vencimento||1)===dom);
    // Parcelas no dia de fatura (usamos dia 22 como padrão)
    const saidasParc=dom===22 ? parcelas : [];
    return {iso,entradas,saidasTx,saidasFixas,saidasParc};
  }).filter(d=> d.entradas.length||d.saidasTx.length||d.saidasFixas.length||d.saidasParc.length);

  const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const fmtDay=iso=>{
    const dt=new Date(iso+'T12:00:00');
    return `${String(dt.getDate()).padStart(2,'0')} ${MESES[dt.getMonth()]}`;
  };

  let totalIn=0,totalOut=0;

  const rows=byDay.map(({iso,entradas,saidasTx,saidasFixas,saidasParc})=>{
    const sumIn=entradas.reduce((s,t)=>s+t.valor,0);
    const sumOutTx=saidasTx.reduce((s,t)=>s+t.valor,0);
    const sumOutFx=saidasFixas.reduce((s,f)=>s+f.valor,0);
    const sumOutPc=saidasParc.reduce((s,p)=>s+p.valor_parcela,0);
    const sumOut=sumOutTx+sumOutFx+sumOutPc;
    totalIn+=sumIn; totalOut+=sumOut;
    const isToday=iso===today_;

    // Build detail lines
    const inLines=entradas.map(t=>`<div class="vg-item green">↑ ${t.descricao||'Entrada'} <b>${brl(t.valor)}</b></div>`).join('');
    const outLines=[
      ...saidasTx.map(t=>`<div class="vg-item red">↓ ${t.descricao||t.categoria||'Gasto'} ${t.forma_pagamento==='cartao'?'💳':'💵'} <b>${brl(t.valor)}</b></div>`),
      ...saidasFixas.map(f=>`<div class="vg-item red">📌 ${f.nome} <b>${brl(f.valor)}</b></div>`),
      ...saidasParc.map(p=>`<div class="vg-item red">💳 ${p.nome} <span class="badge blue">${p.parcela_atual}/${p.total_parcelas}</span> <b>${brl(p.valor_parcela)}</b></div>`),
    ].join('');

    return `
    <div class="vg-day${isToday?' vg-today':''}">
      <div class="vg-header">
        <span class="vg-date">${fmtDay(iso)}${isToday?' <span class="badge blue">Hoje</span>':''}</span>
        <span class="vg-totals">
          ${sumIn?`<span class="green">+${brl(sumIn)}</span>`:''}
          ${sumOut?`<span class="red">−${brl(sumOut)}</span>`:''}
          <span class="vg-net ${sumIn-sumOut>=0?'green':'red'}">=&nbsp;${brl(sumIn-sumOut)}</span>
        </span>
      </div>
      <div class="vg-body">${inLines}${outLines}</div>
    </div>`;
  }).join('');

  const cycleStart=new Date(first+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  const cycleEnd=new Date(last+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});

  el.innerHTML=`
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Ciclo ${cycleStart} → ${cycleEnd}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">
        <div><div style="font-size:11px;color:var(--muted)">Entradas</div><div style="font-size:18px;font-weight:800;color:var(--green)">${brl(totalIn)}</div></div>
        <div><div style="font-size:11px;color:var(--muted)">Saídas</div><div style="font-size:18px;font-weight:800;color:var(--red)">${brl(totalOut)}</div></div>
        <div><div style="font-size:11px;color:var(--muted)">Saldo</div><div style="font-size:18px;font-weight:800;color:${totalIn-totalOut>=0?'var(--green)':'var(--red)'}">${brl(totalIn-totalOut)}</div></div>
      </div>
    </div>
    ${byDay.length===0?'<div class="empty">Nenhum evento neste ciclo ainda.</div>':rows}
  `;
}

function renderInicio(){
  const saldo=calcSaldo();
  const dias=daysRemainingInCycle();
  const possoGastar=saldo/dias;
  const gastoHoje=getTransacoes().filter(t=>t.tipo==='saida' && t.data===todayISO()).reduce((s,t)=>s+t.valor,0);
  const el=document.getElementById('tab-inicio');
  el.innerHTML=`
    <div class="hero">
      <div class="label">Posso gastar hoje</div>
      <div class="big ${possoGastar>=0?'pos':'neg'}">${brl(possoGastar)}</div>
      <div class="sub">Ciclo até dia 22 · saldo ÷ ${dias} dias restantes</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="v ${saldo>=0?'pos':'neg'}">${brl(saldo)}</div><div class="l">Saldo do ciclo</div></div>
      <div class="stat"><div class="v">${brl(gastoHoje)}</div><div class="l">Gasto hoje</div></div>
      <div class="stat"><div class="v">${dias}</div><div class="l">Dias restantes</div></div>
    </div>
    <button class="btn btn-green" onclick="openTxModal()">+ Lançar Gasto</button>
  `;
}

function renderLancamentos(){
  const tx=cycleTransactions().slice().sort((a,b)=>b.data.localeCompare(a.data));
  const entradas=tx.filter(t=>t.tipo==='entrada').reduce((s,t)=>s+t.valor,0);
  const saidas=tx.filter(t=>t.tipo==='saida').reduce((s,t)=>s+t.valor,0);
  const el=document.getElementById('tab-lancamentos');
  let rows=tx.map(t=>{
    const dd=fdate(t.data).slice(0,5);
    const icon=t.forma_pagamento==='cartao'?'💳':'💵';
    const desc=t.descricao?escapeHtml(t.descricao):'<span class="muted">Sem descrição</span>';
    return `<div class="row">
      <div class="main">
        <div class="name">${dd} · ${desc}</div>
        <div class="subt"><span class="badge">${escapeHtml(t.categoria||'—')}</span> ${icon}</div>
      </div>
      <div class="val ${t.tipo==='entrada'?'pos':'neg'}">${t.tipo==='entrada'?'+':'-'}${brl(t.valor)}</div>
      <button class="del" onclick="delTx('${t.id}')">🗑</button>
    </div>`;
  }).join('');
  if(!tx.length) rows='<div class="empty">Nenhum lançamento neste ciclo.</div>';
  el.innerHTML=`
    <h2 class="page-title">Lançamentos</h2>
    <div class="card">
      <div class="totals"><span class="pos">Entradas: ${brl(entradas)}</span><span class="neg">Saídas: ${brl(saidas)}</span></div>
    </div>
    <div class="card">${rows}</div>
    <button class="btn btn-blue" onclick="openTxModal()">+ Lançar Gasto</button>
  `;
}

function renderFixas(){
  const fx=getFixas().filter(f=>f.ativo);
  const total=fx.reduce((s,f)=>s+f.valor,0); // inclui Cartão (apenas listagem)
  const el=document.getElementById('tab-fixas');

    <div class="row">
      <div class="main"><div class="name">${escapeHtml(f.nome)}</div><div class="subt">Vence dia ${f.dia_vencimento}</div></div>
      <div class="val">${brl(f.valor)}</div>
      <button class="del" onclick="delFixa('${f.id}')">🗑</button>

    <div class="card summary-card"><span class="muted">Total mensal</span><span class="v">${brl(total)}</span></div>

function renderParceladas(){

let patrChart=null;
function renderPatrimonio(){
  const sav=getSavings().slice().sort((a,b)=>a.data.localeCompare(b.data));
  const totalGuardado=sav.reduce((s,m)=>s+(m.tipo==='aporte'?m.valor:-m.valor),0);
  const el=document.getElementById('tab-patrimonio');
  let rows=sav.slice().reverse().map(m=>`
    <div class="row">
      <div class="main">
        <div class="name">${m.descricao?escapeHtml(m.descricao):'<span class="muted">Sem descrição</span>'}</div>
        <div class="subt">${fdate(m.data)} <span class="badge ${m.tipo==='aporte'?'green':'red'}">${m.tipo==='aporte'?'Aporte':'Resgate'}</span></div>
      </div>
      <div class="val ${m.tipo==='aporte'?'pos':'neg'}">${m.tipo==='aporte'?'+':'-'}${brl(m.valor)}</div>
      <button class="del" onclick="delSaving('${m.id}')">🗑</button>
    </div>`).join('');
  if(!sav.length) rows='<div class="empty">Nenhuma movimentação.</div>';
  el.innerHTML=`
    <h2 class="page-title">Patrimônio</h2>
    <div class="hero"><div class="label">Total Guardado</div><div class="big pos">${brl(totalGuardado)}</div></div>
    <div class="card"><div class="chart-box"><canvas id="patrChart"></canvas></div></div>
    <div class="card">${rows}</div>
    <button class="btn-add" onclick="openSavingModal()">+ Registrar</button>
  `;
  // cumulative line chart
  let cum=0; const labels=[], data=[];
  sav.forEach(m=>{ cum+=(m.tipo==='aporte'?m.valor:-m.valor); labels.push(fdate(m.data).slice(0,5)); data.push(cum); });
  if(window.Chart){
    if(patrChart) patrChart.destroy();
    const ctx=document.getElementById('patrChart');
    if(ctx) patrChart=new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'Patrimônio acumulado',data,borderColor:'#16A34A',backgroundColor:'rgba(22,163,74,.12)',fill:true,tension:.3,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'R$'+(v/1000)+'k'}}}}});
  }
}

let resumoChart=null;
function renderResumo(){
  const nomes=['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const nomesC=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  // Todos os 12 meses do ano corrente para a tabela (preenche ausentes com —)
  const ano=new Date().getFullYear();
  const allMonths=Array.from({length:12},(_,i)=>{
    const mes=i+1;
    return getSummary().find(m=>m.mes===mes && m.ano===ano) || {id:null,mes,ano,entrada_total:null,economizado:null,imposto_pago:null,fatura_cartao:null};
  });

  const ms=getSummary().filter(m=>m.entrada_total).sort((a,b)=>a.ano-b.ano||a.mes-b.mes);
  const el=document.getElementById('tab-resumo');

  let trs=allMonths.slice().reverse().map(m=>{
    const pct=(m.entrada_total&&m.economizado)?(m.economizado/m.entrada_total*100):null;
    const col=pct===null?'var(--muted)':(pct>25?'var(--green)':(pct>=15?'#CA8A04':'var(--red)'));
    const pctStr=pct!==null?pct.toFixed(0)+'%':'—';
    return `<tr>
      <td>${nomesC[m.mes]}/${m.ano}</td>
      <td>${brl(m.entrada_total)}</td>
      <td>${brl(m.economizado)}</td>
      <td style="color:${col};font-weight:700">${pctStr}</td>
      <td>${brl(m.imposto_pago)}</td>
      <td>${brl(m.fatura_cartao)}</td>
      <td><button class="del" style="font-size:14px" onclick="openResumoModal(${m.mes},${m.ano})">✏️</button></td>
    </tr>`;
  }).join('');

  el.innerHTML=`
    <h2 class="page-title">Resumo</h2>
    <div class="section-title">Evolução Mensal</div>
    <div class="card"><div class="chart-box"><canvas id="resumoChart"></canvas></div></div>
    <div class="section-title">Histórico</div>
    <div class="card" style="overflow-x:auto">
      <table>
        <thead><tr><th>Mês</th><th>Entrada</th><th>Economizado</th><th>% Guard.</th><th>Imposto</th><th>Fatura</th><th></th></tr></thead>
        <tbody>${trs||'<tr><td colspan="7" class="empty">Sem dados.</td></tr>'}</tbody>
      </table>
    </div>
  `;
  if(window.Chart){
    if(resumoChart) resumoChart.destroy();
    const ctx=document.getElementById('resumoChart');
    const labels=ms.map(m=>nomesC[m.mes]+'/'+String(m.ano).slice(2));
    if(ctx) resumoChart=new Chart(ctx,{
      data:{labels,datasets:[
        {type:'bar',label:'Entrada',data:ms.map(m=>m.entrada_total),backgroundColor:'#2563EB',yAxisID:'y'},
        {type:'bar',label:'Economizado',data:ms.map(m=>m.economizado),backgroundColor:'#16A34A',yAxisID:'y'},
        {type:'line',label:'% Guardada',data:ms.map(m=>m.entrada_total?+(m.economizado/m.entrada_total*100).toFixed(1):0),borderColor:'#0F1623',backgroundColor:'#0F1623',yAxisID:'y1',tension:.3,pointRadius:3}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}},
        scales:{
          y:{position:'left',ticks:{callback:v=>'R$'+(v/1000)+'k'}},
          y1:{position:'right',grid:{drawOnChartArea:false},ticks:{callback:v=>v+'%'},min:0,max:100}
        }}
    });
  }
}

function openResumoModal(mes,ano){
  const nomes=['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const ex=getSummary().find(m=>m.mes===mes && m.ano===ano);
  const v=(field)=>ex&&ex[field]!=null?ex[field]:'';
  openModal(`
    <h3>${nomes[mes]} ${ano}</h3>
    <div class="field"><label>Entrada total (R$)</label><input id="rs-entrada" type="number" step="0.01" inputmode="decimal" placeholder="0,00" value="${v('entrada_total')}"></div>
    <div class="field"><label>Dinheiro guardado (R$)</label><input id="rs-eco" type="number" step="0.01" inputmode="decimal" placeholder="0,00" value="${v('economizado')}"></div>
    <div class="field"><label>Imposto pago (R$)</label><input id="rs-imp" type="number" step="0.01" inputmode="decimal" placeholder="0,00" value="${v('imposto_pago')}"></div>
    <div class="field"><label>Fatura cartão (R$)</label><input id="rs-fat" type="number" step="0.01" inputmode="decimal" placeholder="0,00" value="${v('fatura_cartao')}"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-green" style="color:#fff" onclick="saveResumo(${mes},${ano})">Salvar</button>
    </div>
  `);
}

function saveResumo(mes,ano){
  const parse=id=>{ const v=parseFloat(document.getElementById(id).value); return isNaN(v)?null:v; };
  const entrada_total=parse('rs-entrada');
  const economizado=parse('rs-eco');
  const imposto_pago=parse('rs-imp');
  const fatura_cartao=parse('rs-fat');
  const idx=DB.monthly_summary.findIndex(m=>m.mes===mes && m.ano===ano);
  if(idx>=0){
    DB.monthly_summary[idx]={...DB.monthly_summary[idx],entrada_total,economizado,imposto_pago,fatura_cartao};
  } else {
    DB.monthly_summary.push({id:uid(),mes,ano,entrada_total,economizado,imposto_pago,fatura_cartao});
  }
  saveDB(); closeModal(); renderResumo(); toast('Resumo salvo!');
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============ DELETES ============ */
function delTx(id){ if(confirm('Excluir este lançamento?')){ DB.transacoes=DB.transacoes.filter(t=>t.id!==id); saveDB(); renderInicio(); renderLancamentos(); toast('Lançamento excluído'); } }
function delFixa(id){ if(confirm('Excluir esta conta fixa?')){ DB.fixas=DB.fixas.filter(f=>f.id!==id); saveDB(); renderFixas(); renderInicio(); toast('Conta excluída'); } }
function delParcela(id){ if(confirm('Excluir esta parcela?')){ DB.parceladas=DB.parceladas.filter(p=>p.id!==id); saveDB(); renderParceladas(); renderInicio(); toast('Parcela excluída'); } }
function delSaving(id){ if(confirm('Excluir esta movimentação?')){ DB.savings=DB.savings.filter(s=>s.id!==id); saveDB(); renderPatrimonio(); toast('Movimentação excluída'); } }

function setTxTipo(t){ txTipo=t; document.getElementById('tg-out').className=t==='saida'?'on-out':''; document.getElementById('tg-in').className=t==='entrada'?'on-in':''; }
function saveTx(){
  const valor=parseFloat(document.getElementById('m-valor').value);
  if(!(valor>0)){ toast('Informe um valor válido'); return; }
  DB.transacoes.push({id:uid(),data:document.getElementById('m-data').value||todayISO(),tipo:txTipo,valor,
    descricao:document.getElementById('m-desc').value.trim(),categoria:document.getElementById('m-cat').value.trim(),
    forma_pagamento:document.getElementById('m-forma').value});
  saveDB(); closeModal(); renderInicio(); renderLancamentos(); toast('Lançamento salvo');

function openFixaModal(){
  openModal(`
    <h3>Adicionar Conta Fixa</h3>
    <div class="field"><label>Nome</label><input id="f-nome" type="text" placeholder="Ex: Internet"></div>
    <div class="field"><label>Valor</label><input id="f-valor" type="number" step="0.01" inputmode="decimal" placeholder="0,00"></div>

function saveFixa(){
  const nome=document.getElementById('f-nome').value.trim();
  const valor=parseFloat(document.getElementById('f-valor').value);
  const dia=parseInt(document.getElementById('f-dia').value)||1;

  saveDB(); closeModal(); renderFixas(); renderInicio(); toast('Conta adicionada');

function openParcelaModal(){
  openModal(`
    <h3>Adicionar Parcelamento</h3>

    <div class="field"><label>Valor da parcela</label><input id="p-valor" type="number" step="0.01" inputmode="decimal" placeholder="0,00"></div>
    <div class="field"><label>Parcela atual</label><input id="p-atual" type="number" min="1" value="1"></div>
    <div class="field"><label>Total de parcelas</label><input id="p-total" type="number" min="1" value="1"></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Cancelar</button><button class="btn-blue" style="color:#fff" onclick="saveParcela()">Salvar</button></div>
  `);

function saveParcela(){
  const nome=document.getElementById('p-nome').value.trim();
  const vp=parseFloat(document.getElementById('p-valor').value);
  const pa=parseInt(document.getElementById('p-atual').value)||1;
  const tp=parseInt(document.getElementById('p-total').value)||1;
  if(!nome||!(vp>0)){ toast('Preencha nome e valor'); return; }
  DB.parceladas.push({id:uid(),nome,valor_parcela:vp,parcela_atual:pa,total_parcelas:tp,ativo:true});
  saveDB(); closeModal(); renderParceladas(); renderInicio(); toast('Parcelamento adicionado');
}

let savTipo='aporte';
function openSavingModal(){
  savTipo='aporte';
  openModal(`
    <h3>Registrar Movimentação</h3>
    <div class="field"><label>Tipo</label>
      <div class="toggle">
        <button id="sv-ap" class="on-blue" onclick="setSavTipo('aporte')">Aporte</button>
        <button id="sv-rg" onclick="setSavTipo('resgate')">Resgate</button>
      </div>
    </div>
    <div class="field"><label>Valor</label><input id="s-valor" type="number" step="0.01" inputmode="decimal" placeholder="0,00"></div>
    <div class="field"><label>Data</label><input id="s-data" type="date" value="${todayISO()}"></div>
    <div class="field"><label>Descrição</label><input id="s-desc" type="text" placeholder="Ex: Reserva"></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Cancelar</button><button class="btn-blue" style="color:#fff" onclick="saveSaving()">Salvar</button></div>
  `);
}
function setSavTipo(t){ savTipo=t; document.getElementById('sv-ap').className=t==='aporte'?'on-blue':''; document.getElementById('sv-rg').className=t==='resgate'?'on-blue':''; }
function saveSaving(){
  const valor=parseFloat(document.getElementById('s-valor').value);
  if(!(valor>0)){ toast('Informe um valor válido'); return; }
  DB.savings.push({id:uid(),data:document.getElementById('s-data').value||todayISO(),tipo:savTipo,valor,descricao:document.getElementById('s-desc').value.trim()});
  saveDB(); closeModal(); renderPatrimonio(); toast('Movimentação registrada');
}

/* ============ TOAST ============ */
let toastTimer=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

/* ============ TABS ============ */
document.querySelectorAll('.nav-in button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.nav-in button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const tab=b.dataset.tab;
    document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));
    document.getElementById('tab-'+tab).classList.add('active');
    if(tab==='patrimonio') renderPatrimonio();
    if(tab==='resumo') renderResumo();
    if(tab==='visao') renderVisao();
    window.scrollTo(0,0);
  });
});

/* ============ AUDIO + BANNER ============ */
function playAudio(){ const a=document.getElementById('sccp-audio'); if(a) a.play().catch(()=>{}); }
function initBannerAudio(){
  playAudio();
  const banner=document.getElementById('banner');
  setTimeout(()=>{ banner.style.opacity='0'; setTimeout(()=>banner.style.display='none',900); },3000);
  // fallback: browsers may block autoplay until a user gesture
  const once=()=>{ playAudio(); document.removeEventListener('click',once); document.removeEventListener('touchstart',once); };
  document.addEventListener('click',once,{once:true});
  document.addEventListener('touchstart',once,{once:true});
}

/* ============ INIT ============ */
loadDB();
renderAll();
initBannerAudio();
</script>
