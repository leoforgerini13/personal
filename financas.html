<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanças</title>
<meta name="theme-color" content="#F5F5F8" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0C0A12" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script id="app-vendor" src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style id="app-css">
/* ── Design tokens ─────────────────────────────────────────────
   Paleta validada (dataviz): contraste >= 4.5:1 em todos os pares
   de texto; séries categóricas aprovadas em CVD (light e dark).   */
:root{
  color-scheme:light;
  /* Marca */
  --accent:#6D4AFF; --accent-strong:#5B3AE8; --on-accent:#FFFFFF;
  --accent-soft:rgba(109,74,255,.10); --accent-ring:rgba(109,74,255,.22);
  /* Status */
  --pos:#0E7C5A; --neg:#D93B3B; --warn:#C98500;
  --pos-soft:rgba(14,124,90,.10); --neg-soft:rgba(217,59,59,.10);
  /* Séries de gráfico */
  --series-1:#6D4AFF; --series-2:#EB6834; --series-3:#0E9F6E; --series-4:#C98500;
  /* Superfícies */
  --bg:#F5F5F8; --surface:#FFFFFF; --surface2:#F4F4F8; --surface3:#EDECF3;
  --text:#14131C; --text2:#6B6880; --border:#E9E8EF;
  /* Cartão "ink" (destaque escuro) */
  --ink:#1C1830; --ink-text:#FFFFFF; --ink-muted:rgba(255,255,255,.62);
  --ink-line:rgba(255,255,255,.14);
  /* Sidebar */
  --sb-bg:#FFFFFF; --sb-text:#14131C; --sb-muted:#6B6880;
  --sb-hover:#F4F4F8; --sb-border:#EDECF3;
  /* Forma */
  --sidebar-w:236px;
  --r-lg:18px; --r-md:12px; --r-sm:10px;
  --shadow:0 1px 2px rgba(20,19,28,.04),0 1px 3px rgba(20,19,28,.05);
  --shadow-md:0 4px 14px rgba(20,19,28,.07),0 1px 3px rgba(20,19,28,.04);
}
/* Dark: passo próprio a partir das mesmas rampas — não é inversão automática */
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --accent:#8A6AF0; --accent-strong:#7A57E8; --on-accent:#FFFFFF;
  --accent-soft:rgba(138,106,240,.16); --accent-ring:rgba(138,106,240,.30);
  --pos:#3DD68C; --neg:#FF7070; --warn:#E0A32A;
  --pos-soft:rgba(61,214,140,.14); --neg-soft:rgba(255,112,112,.14);
  --series-1:#8A6AF0; --series-2:#DE6636; --series-3:#1FA774; --series-4:#B88A00;
  --bg:#0C0A12; --surface:#16141F; --surface2:#1E1B2B; --surface3:#262232;
  --text:#F3F2F7; --text2:#9490A8; --border:#2A2637;
  --ink:#1E1A2E; --ink-text:#FFFFFF; --ink-muted:rgba(255,255,255,.62);
  --ink-line:rgba(255,255,255,.12);
  --sb-bg:#110F1A; --sb-text:#F3F2F7; --sb-muted:#8B87A0;
  --sb-hover:#1E1B2B; --sb-border:#241F31;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 6px 20px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --accent:#8A6AF0; --accent-strong:#7A57E8; --on-accent:#FFFFFF;
  --accent-soft:rgba(138,106,240,.16); --accent-ring:rgba(138,106,240,.30);
  --pos:#3DD68C; --neg:#FF7070; --warn:#E0A32A;
  --pos-soft:rgba(61,214,140,.14); --neg-soft:rgba(255,112,112,.14);
  --series-1:#8A6AF0; --series-2:#DE6636; --series-3:#1FA774; --series-4:#B88A00;
  --bg:#0C0A12; --surface:#16141F; --surface2:#1E1B2B; --surface3:#262232;
  --text:#F3F2F7; --text2:#9490A8; --border:#2A2637;
  --ink:#1E1A2E; --ink-text:#FFFFFF; --ink-muted:rgba(255,255,255,.62);
  --ink-line:rgba(255,255,255,.12);
  --sb-bg:#110F1A; --sb-text:#F3F2F7; --sb-muted:#8B87A0;
  --sb-hover:#1E1B2B; --sb-border:#241F31;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 6px 20px rgba(0,0,0,.45);
}
/* ── Reset ─────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.45;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:'tnum' 1;
}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ── Layout ─────────────────────────────────────────────────── */
.layout{display:flex;min-height:100vh}
/* ── Sidebar ────────────────────────────────────────────────── */
.sidebar{
  width:var(--sidebar-w);flex:none;
  background:var(--sb-bg);color:var(--sb-text);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:60;
  border-right:1px solid var(--sb-border);
  transition:transform .25s;
}
.sb-brand{display:flex;align-items:center;gap:11px;padding:22px 18px 18px}
.sb-mark{
  width:34px;height:34px;flex:none;border-radius:11px;
  background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;letter-spacing:-.5px;
}
.sb-brand span{font-weight:800;font-size:17px;letter-spacing:-.3px}
.sb-nav{flex:1;padding:6px 12px;display:flex;flex-direction:column;gap:3px}
.sb-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2);padding:8px 10px 6px}
.sb-nav button{
  display:flex;align-items:center;gap:11px;
  width:100%;background:none;border:none;
  color:var(--sb-muted);font-size:14px;font-weight:600;
  padding:11px 12px;border-radius:var(--r-md);cursor:pointer;
  text-align:left;transition:background .15s,color .15s;
}
.sb-nav button .sb-ic{width:20px;display:inline-flex;align-items:center;justify-content:center;opacity:.9}
.sb-nav button:hover{background:var(--sb-hover);color:var(--sb-text)}
.sb-nav button.active{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px var(--accent-ring)}
.sb-nav button.active .sb-ic{color:var(--on-accent);opacity:1}
.sb-foot{padding:12px;border-top:1px solid var(--sb-border);display:flex;gap:8px}
.sb-foot button{
  flex:1;background:var(--sb-hover);color:var(--sb-muted);
  border:none;border-radius:var(--r-sm);padding:9px;font-size:12px;
  font-weight:600;cursor:pointer;transition:color .15s,background .15s;
}
.sb-foot button:hover{color:var(--sb-text)}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(12,10,18,.55);z-index:59}
/* ── Main ───────────────────────────────────────────────────── */
.main-wrap{flex:1;margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column}
.mob-header{
  display:none;position:sticky;top:0;z-index:50;
  background:var(--surface);color:var(--text);border-bottom:1px solid var(--border);
  padding:12px 16px;align-items:center;gap:10px;
}
.mob-header .mob-title{flex:1;font-weight:700;font-size:16px;letter-spacing:-.2px}
.mob-btn{background:var(--surface2);color:var(--text);border:none;border-radius:var(--r-sm);padding:8px 11px;font-size:14px;cursor:pointer}
/* ── Pages ──────────────────────────────────────────────────── */
main{padding:26px 28px 40px;max-width:1160px;width:100%}
.tab-page{display:none}
.tab-page.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* ── Cards ──────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card-dark{background:var(--ink);color:var(--ink-text);border-radius:var(--r-lg);padding:24px;margin-bottom:16px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.dash-grid .span2{grid-column:1/-1}
.dash-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
/* ── Stat cards ─────────────────────────────────────────────── */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 18px}
.stat-card .sc-label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--text2);font-weight:700;margin-bottom:6px}
.stat-card .sc-val{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.6px}
.stat-card .sc-sub{font-size:12px;color:var(--text2);margin-top:5px}
/* ── Hero gauge ─────────────────────────────────────────────── */
.hero-card{background:var(--ink);color:var(--ink-text);border-radius:var(--r-lg);padding:24px;display:flex;align-items:center;gap:22px}
.gauge-wrap{position:relative;width:100px;height:100px;flex:none}
.gauge-wrap svg{width:100px;height:100px;transform:rotate(-90deg)}
.gauge-bg{fill:none;stroke:rgba(255,255,255,.14);stroke-width:9}
.gauge-fg{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .5s ease,stroke .3s}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-pct{font-size:21px;font-weight:800;line-height:1;letter-spacing:-.5px}
.gauge-cap{font-size:9px;color:var(--ink-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.6px}
.hero-text .ht-label{font-size:11px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.hero-text .ht-val{font-size:40px;font-weight:800;line-height:1.05;margin:6px 0;letter-spacing:-1.4px}
.hero-text .ht-sub{font-size:12px;color:var(--ink-muted)}
/* ── Tags ───────────────────────────────────────────────────── */
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.4}
.tag-accent{background:var(--accent);color:var(--on-accent)}
.tag-green{background:var(--pos-soft);color:var(--pos)}
.tag-red{background:var(--neg-soft);color:var(--neg)}
.tag-blue{background:var(--accent-soft);color:var(--accent)}
.tag-gray{background:var(--surface2);color:var(--text2)}
/* ── Section titles ─────────────────────────────────────────── */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px;gap:10px;flex-wrap:wrap}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.9px;font-weight:700;color:var(--text2)}
/* ── Rows ───────────────────────────────────────────────────── */
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface2)}
.row .rm{flex:1;min-width:0}
.row .rname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.row .rsub{font-size:12px;color:var(--text2);margin-top:3px}
.row .rval{font-weight:700;font-size:14px;white-space:nowrap;letter-spacing:-.2px}
.del{background:none;border:none;color:var(--neg);font-size:15px;cursor:pointer;padding:5px 7px;border-radius:8px;opacity:.55;transition:opacity .15s,background .15s}
.del:hover{opacity:1;background:var(--neg-soft)}
@keyframes rowIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
@keyframes rowOut{to{opacity:0;transform:translateX(30px);max-height:0;padding:0}}
.row.row-new{animation:rowIn .25s ease}
.row.leaving{animation:rowOut .18s ease forwards;overflow:hidden}
/* ── Progress ───────────────────────────────────────────────── */
.card-dark .prog{background:var(--ink-line)}
.prog{height:6px;background:var(--surface3);border-radius:999px;overflow:hidden;margin-top:8px}
.prog>div{height:100%;border-radius:999px;transition:width .4s ease}
/* ── 50/30/20 ───────────────────────────────────────────────── */
.rule-row{margin-bottom:16px}
.rule-row:last-child{margin-bottom:0}
.rule-labels{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.rule-labels .rl-name{font-weight:700;color:var(--text)}
.rule-labels .rl-pct{color:var(--text2)}
.rule-bar{height:9px;background:var(--surface3);border-radius:999px;overflow:hidden;position:relative}
.rule-bar-fill{height:100%;border-radius:999px;transition:width .5s ease}
.rule-target{position:absolute;top:0;bottom:0;width:2px;background:var(--text2);opacity:.45}
.rule-note{font-size:11px;color:var(--text2);margin-top:5px}
/* ── Alocação ───────────────────────────────────────────────── */
.alloc-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.alloc-dot{width:10px;height:10px;border-radius:3px;flex:none}
.alloc-name{flex:1;font-size:13px;font-weight:600}
.alloc-pct{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.alloc-val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
/* ── Runway ─────────────────────────────────────────────────── */
.runway-big{font-size:46px;font-weight:800;line-height:1;margin-bottom:4px;letter-spacing:-1.6px}
/* ── Tabela ─────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:11px 8px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
th{color:var(--text2);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.7px}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:none}
/* ── Subnav ─────────────────────────────────────────────────── */
.subnav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.subnav button{
  padding:8px 15px;border:1px solid var(--border);border-radius:999px;
  font-size:13px;font-weight:600;color:var(--text2);background:var(--surface);cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.subnav button:hover{color:var(--text)}
.subnav button.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.subview{display:none}
.subview.active{display:block}
/* ── Seletor de ciclo ───────────────────────────────────────── */
.cycle-sel{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow);padding:5px}
.cycle-sel>button{width:32px;height:32px;border:none;background:transparent;color:var(--text2);border-radius:50%;font-size:17px;cursor:pointer;flex:none;transition:background .15s,color .15s}
.cycle-sel>button:hover{background:var(--surface2);color:var(--text)}
.cycle-mid{padding:0 10px;text-align:center;cursor:pointer}
.cycle-range{font-weight:700;font-size:13px;letter-spacing:-.2px}
.cycle-tag{font-size:10px;color:var(--text2);margin-top:1px}
/* ── Botões ─────────────────────────────────────────────────── */
.btn-add{
  display:block;width:100%;border:none;border-radius:var(--r-md);padding:14px;
  font-size:14px;font-weight:700;cursor:pointer;
  background:var(--accent);color:var(--on-accent);margin-top:10px;
  box-shadow:0 2px 10px var(--accent-ring);transition:background .15s;
}
.btn-add:hover{background:var(--accent-strong)}
.btn-add.btn-soft{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn-add.btn-soft:hover{background:var(--accent-ring)}
.btn-add.btn-soft-pos{background:var(--pos-soft);color:var(--pos);box-shadow:none}
.btn-add.btn-soft-pos:hover{filter:brightness(.97)}
.dash-side{display:grid;grid-template-rows:1fr 1fr;gap:16px}
.btn-accent{background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--r-sm);padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s}
.btn-accent:hover{background:var(--accent-strong)}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 13px;font-size:12px;font-weight:600;cursor:pointer}
.btn-ghost:hover{background:var(--surface2)}
.btn-danger{background:var(--neg);color:#fff}
/* ── Modais ─────────────────────────────────────────────────── */
.backdrop{position:fixed;inset:0;background:rgba(12,10,18,.55);z-index:100;display:none}
.backdrop.open{display:block}
.modal{
  position:fixed;left:0;right:0;bottom:0;z-index:101;
  background:var(--surface);color:var(--text);
  border-radius:22px 22px 0 0;padding:24px;max-width:560px;margin:0 auto;
  transform:translateY(100%);transition:transform .28s;
  max-height:92vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(12,10,18,.25);
}
.modal.open{transform:translateY(0)}
.modal h3{margin-bottom:18px;font-size:19px;font-weight:800;letter-spacing:-.4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.field input,.field select{
  width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:var(--r-sm);
  font-size:15px;background:var(--surface2);color:var(--text);transition:border-color .15s,box-shadow .15s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{
  width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:var(--r-sm);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;
  background:var(--surface2);color:var(--text);resize:vertical;min-height:150px;
}
.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.aviso{
  font-size:12px;line-height:1.6;color:var(--text2);background:var(--surface2);
  border-radius:var(--r-sm);padding:11px 13px;margin-bottom:14px;
}
.toggle{display:flex;gap:8px}
.toggle button{flex:1;padding:12px;border:1px solid var(--border);background:var(--surface2);border-radius:var(--r-sm);font-size:14px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s}
.toggle button.on-out{background:var(--neg);color:#fff;border-color:var(--neg)}
.toggle button.on-in{background:var(--pos);color:#fff;border-color:var(--pos)}
.toggle button.on-blue{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;margin-top:14px}
.modal-actions button{flex:1;padding:14px;border:none;border-radius:var(--r-md);font-size:14px;font-weight:700;cursor:pointer}
.btn-cancel{background:var(--surface2);color:var(--text)}
.btn-cancel:hover{background:var(--surface3)}
/* ── Toast ──────────────────────────────────────────────────── */
#toast{
  position:fixed;top:-90px;left:50%;transform:translateX(-50%);z-index:300;
  background:var(--ink);color:var(--ink-text);padding:12px 20px;border-radius:999px;
  box-shadow:0 8px 28px rgba(12,10,18,.3);transition:top .3s;font-size:13px;
  font-weight:600;max-width:90%;display:flex;align-items:center;gap:12px;
}
#toast.show{top:16px}
.toast-undo{background:none;border:none;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;padding:0}
/* ── Diversos ───────────────────────────────────────────────── */
.empty{text-align:center;color:var(--text2);padding:26px 0;font-size:13px}
.muted{color:var(--text2)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chart-box{position:relative;height:230px}
.chart-cap{font-size:11px;color:var(--text2);margin-top:10px;text-align:center}
/* ── Visão diária ───────────────────────────────────────────── */
.vg-day{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.vg-today{border:1.5px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.vg-header{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:6px}
.vg-date{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.vg-totals{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.vg-body{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.vg-item{font-size:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.vg-item b{margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.cat-ic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;font-size:14px;margin-right:8px;flex:none}
.search-input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:14px;background:var(--surface2);color:var(--text)}
.search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filters{display:flex;gap:8px;margin-top:10px}
.filters select{flex:1;min-width:0;padding:9px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface2);color:var(--text);font-size:12px;cursor:pointer}
/* ── Chip de sincronização ──────────────────────────────────── */
.sync-chip{
  margin:0 12px 10px;padding:7px 11px;border-radius:var(--r-sm);
  font-size:11px;font-weight:600;display:flex;align-items:center;gap:7px;
  background:var(--sb-hover);color:var(--sb-muted);
}
.sync-chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.sync-chip.salvando{color:var(--accent)}
.sync-chip.salvando .dot{animation:pulsa 1s ease-in-out infinite}
.sync-chip.salvo{color:var(--pos)}
.sync-chip.erro{color:var(--neg)}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.sync-chip.salvando .dot{animation:none}}
/* ── Grade mensal ────────────────────────────────────────────── */
.mg-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mg-tabela{width:100%;border-collapse:collapse;font-size:13px;min-width:430px}
.mg-tabela th{
  position:sticky;top:0;z-index:2;background:var(--surface);
  color:var(--text2);font-weight:700;font-size:10px;text-transform:uppercase;
  letter-spacing:.7px;padding:10px 8px;border-bottom:1px solid var(--border);text-align:right;
}
.mg-tabela th:first-child{text-align:left}
.mg-tabela td{padding:0 4px;border-bottom:1px solid var(--border);vertical-align:middle}
.mg-tabela tr:last-child td{border-bottom:none}
.mg-dia{
  padding:8px 8px !important;white-space:nowrap;font-weight:600;
  font-variant-numeric:tabular-nums;width:1%;
}
.mg-dia small{display:block;font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
.mg-cel{padding:4px 2px !important;width:180px}
.mg-tabela tbody tr{cursor:default}
.mg-tabela tbody tr:hover td{background:transparent}
.mg-tabela tbody tr:hover .mg-in{background:var(--surface2)}
.mg-in{
  width:100%;max-width:170px;margin-left:auto;display:block;min-width:96px;border:1px solid transparent;background:transparent;
  border-radius:var(--r-sm);padding:9px 10px;text-align:right;
  font:inherit;font-size:13px;font-weight:600;color:var(--text);
  font-variant-numeric:tabular-nums;transition:background .12s,border-color .12s;
}
.mg-in::placeholder{color:var(--text2);opacity:.45;font-weight:400}
.mg-in:hover{background:var(--surface2)}
.mg-in:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.mg-in.has-val.mg-ent{color:var(--pos)}
.mg-in.has-val.mg-sai{color:var(--neg)}
.mg-fixo{
  display:block;font-size:10px;font-weight:600;text-align:right;
  padding:0 10px 5px;font-variant-numeric:tabular-nums;
}
.mg-fixo.ent{color:var(--pos)} .mg-fixo.sai{color:var(--neg)}
.mg-saldo{
  width:170px;text-align:right;padding:8px 10px !important;font-weight:700;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.mg-row.hoje{background:var(--accent-soft)}
.mg-row.hoje .mg-dia{color:var(--accent)}
.mg-row.virada td{border-top:2px solid var(--border)}
.mg-legenda{font-size:11px;color:var(--text2);margin-top:12px;line-height:1.7}
@media(max-width:768px){
  /* As colunas cabem na tela: o body nunca rola na horizontal.
     O overflow do .mg-wrap fica como rede para telas ainda mais estreitas. */
  .mg-tabela{min-width:0;font-size:12px}
  .mg-tabela th{padding:9px 4px;font-size:9px;letter-spacing:.4px}
  .mg-dia{padding:8px 4px !important}
  .mg-cel{width:auto;padding:3px 1px !important}
  .mg-in{min-width:0;max-width:none;padding:9px 6px;font-size:12px}
  .mg-fixo{font-size:9px;padding:0 6px 4px}
  .mg-saldo{width:auto;padding:8px 4px !important;font-size:12px}
}
/* ── Mobile ─────────────────────────────────────────────────── */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.2)}
  .sidebar.open{transform:translateX(0)}
  .sb-overlay.open{display:block}
  .main-wrap{margin-left:0}
  .mob-header{display:flex}
  main{padding:16px 14px 34px}
  .dash-grid{grid-template-columns:1fr}
  .dash-side{grid-template-rows:auto auto;gap:10px}
  .dash-grid3{grid-template-columns:1fr;gap:10px}
  .dash-grid3 .stat-card{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
  .dash-grid3 .sc-label{margin-bottom:0}
  .dash-grid3 .sc-val{font-size:19px}
  .hero-card{gap:16px;padding:20px}
  .hero-text .ht-val{font-size:30px}
  .runway-big{font-size:38px}
  .modal{padding:20px 18px 26px}
}
/* No desktop o CTA não precisa varrer a largura toda */
@media(min-width:769px){
  main .btn-add{width:auto;min-width:240px;padding:13px 28px}
}
@media(prefers-reduced-motion:reduce){
  .tab-page.active,.row.row-new{animation:none}
  .row.leaving{animation-duration:.01s}
  .modal,.gauge-fg,.prog>div,.rule-bar-fill{transition:none}
}
</style>

<script id="app-js">
/* ============ DATA LAYER ============ */
const KEY='financas_v1';
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(16).slice(2));

const CAT_DEFAULTS=[
  ['Alimentação','🍔','#EB6834'],['Transporte','🚗','#2A78D6'],['Moradia','🏠','#6D4AFF'],
  ['Lazer','🎉','#C2437E'],['Saúde','💊','#0E9F6E'],['Compras','🛍️','#C98500'],['Outros','📦','#6B6880']
];
function defaultCategorias(){ return CAT_DEFAULTS.map(([nome,icone,cor])=>({id:uid(),nome,icone,cor,orcamento:null})); }

function seed(){
  const fixas=[
    ['Financiamento',2269,10],['Psicólogo',1920,15],['Condomínio',633,5],['Cartão',838,22],
    ['Plano de saúde',250,1],['Contador',200,10],['Gympass',140,1],['Contas Mãe',128,5],
    ['Claude',115,1],['Basquete FFLCH',60,15],['Apple',50,1],['Nubank',50,1]
  ].map(([nome,valor,dia])=>({id:uid(),nome,valor,dia_vencimento:dia,ativo:true}));
  const parceladas=[
    ['Sousmiles',388,16,18],['Moletom Corinthians',250,2,2],['Lacoste',200,2,2]
  ].map(([nome,vp,pa,tp])=>({id:uid(),nome,valor_parcela:vp,parcela_atual:pa,total_parcelas:tp,ativo:true}));
  const monthly_summary=[
    [1,2026,18000,2950],[2,2026,18000,4200],[3,2026,20500,6364],[4,2026,23212,5760],
    [5,2026,32118,20168],[6,2026,35993,21740],[7,2026,18715,8200],[8,2026,14600,0]
  ].map(([mes,ano,et,ec])=>({id:uid(),mes,ano,entrada_total:et,economizado:ec,imposto_pago:null,fatura_cartao:null}));
  // Agosto não entra: economia do mês foi zero, e zero não é movimentação.
  const savings=[
    ['2026-01-31',2950,'Economia de Janeiro'],['2026-02-28',4200,'Economia de Fevereiro'],
    ['2026-03-31',6364,'Economia de Março'],['2026-04-30',5760,'Economia de Abril'],
    ['2026-05-31',20168,'Economia de Maio'],['2026-06-30',21740,'Economia de Junho'],
    ['2026-07-31',8200,'Economia de Julho']
  ].map(([data,valor,desc])=>({id:uid(),data,tipo:'aporte',valor,descricao:desc,alocacao:'reserva'}));
  const entradas_fixas=[{id:uid(),nome:'Salário Inpress',valor:10000,dia_recebimento:10,ativo:true}];
  return {fixas,parceladas,transacoes:[],monthly_summary,savings,entradas_fixas,categorias:defaultCategorias(),metaPoupanca:null};
}

let DB=null;

/* ============ ONDE OS DADOS MORAM ============
   Publicado como Artifact, os dados ficam dentro da própria página (no
   <script id="app-dados">), e não no localStorage: assim eles viajam com o
   artifact, sobrevivem à troca de aparelho e podem ser lidos e editados pelo
   Claude na conversa. Aberto como arquivo solto, o localStorage continua
   valendo. */
let modoArtifact=false, somenteLeitura=false, capArtifact=null;

function dadosEmbutidos(){
  const el=document.getElementById('app-dados');
  if(!el) return null;
  try{ const d=JSON.parse(el.textContent); return (d&&typeof d==='object')?d:null; }
  catch(e){ return null; }
}

async function loadDB(){
  const embutido=dadosEmbutidos();
  // Quem manda na origem dos dados é o bloco embutido; a capability decide
  // apenas se dá para ESCREVER. Um visualizador só-leitura enxerga tudo.
  modoArtifact=!!embutido;
  if(typeof window.claude?.use==='function'){
    try{ capArtifact=await window.claude.use('artifact'); }catch(e){ capArtifact=null; }
  }
  somenteLeitura=modoArtifact&&!capArtifact;

  if(modoArtifact){
    DB=embutido.__semDados?seed():embutido;
  } else {
    DB=null;
    const raw=localStorage.getItem(KEY);
    if(raw){ try{ DB=JSON.parse(raw); }catch(e){ DB=null; } }
    if(!DB) DB=seed();
  }
  migrateDB();
  advanceCyclesIfNeeded();
  gravaLocal();
}

function gravaLocal(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){} }

/* saveDB é chamado por toda a app depois de mexer nos dados. */
function saveDB(){
  gravaLocal();
  if(modoArtifact&&!somenteLeitura) agendaSync();
}

/* ---- Sincronização com o artifact ---- */
let syncTimer=null, syncing=false, atrasoSync=3000, esperasPorFoco=0;
const ESTADO_UI='financas_ui';

function chip(estado,texto){
  const el=document.getElementById('sync-chip');
  if(!el) return;
  if(!estado){ el.hidden=true; return; }
  el.hidden=false; el.className='sync-chip '+estado;
  el.innerHTML='<span class="dot"></span><span>'+escapeHtml(texto)+'</span>';
}

function agendaSync(){
  clearTimeout(syncTimer);
  esperasPorFoco=0;   // houve edição de verdade: a paciência recomeça
  chip('salvando','Salvando…');
  syncTimer=setTimeout(sincroniza,atrasoSync);
}

async function sincroniza(){
  if(!modoArtifact||somenteLeitura||syncing) return;
  // Publicar recarrega a página, então esperamos o usuário sair do campo em
  // vez de arrancá-lo debaixo da mão dele. Mas a espera é limitada: o foco
  // pode ficar parado numa célula para sempre, e aí nada seria salvo.
  const foco=document.activeElement;
  if(foco&&/^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName)){
    if(esperasPorFoco<4){ esperasPorFoco++; clearTimeout(syncTimer); syncTimer=setTimeout(sincroniza,1500); return; }
    foco.blur();                              // confirma o que estava digitado
    await new Promise(r=>setTimeout(r,0));    // deixa o onchange rodar antes
  }
  syncing=true; chip('salvando','Salvando…');
  guardaEstadoUI();
  try{
    await capArtifact.publish(documentoCompleto());
    chip('salvo','Salvo'); // a página recarrega logo em seguida
  }catch(e){
    syncing=false;
    const cod=e&&e.code;
    if(cod==='conflict'){ chip('salvando','Atualizando…'); return; } // recarrega sozinho
    if(cod==='not_writer'||cod==='not_granted'||cod==='not_declared'||
       cod==='capability_disabled'||cod==='capability_removed'||cod==='consent_required'){
      somenteLeitura=true; chip('erro','Somente leitura');
      toast('Este artifact é somente leitura — as mudanças ficam só neste navegador');
      return;
    }
    if(cod==='rate_limited'){ atrasoSync=Math.min(atrasoSync*2,30000); chip('salvando','Salvando…'); agendaSync(); return; }
    if(cod==='too_large'){ chip('erro','Dados grandes demais'); toast('Dados grandes demais para salvar'); return; }
    chip('erro','Falha ao salvar'); toast('Não deu para salvar — tentando de novo');
    setTimeout(agendaSync,8000);
  }
}

/* A recarga após publicar não pode custar o lugar onde o usuário estava. */
function guardaEstadoUI(){
  try{ sessionStorage.setItem(ESTADO_UI,JSON.stringify({aba:activeTab,ciclo:cycleOffset,y:window.scrollY})); }catch(e){}
}
function restauraEstadoUI(){
  let st; try{ st=JSON.parse(sessionStorage.getItem(ESTADO_UI)||'null'); }catch(e){ st=null; }
  if(!st) return;
  try{ sessionStorage.removeItem(ESTADO_UI); }catch(e){}
  if(typeof st.ciclo==='number') cycleOffset=st.ciclo;
  if(st.aba&&st.aba!=='inicio'&&TAB_VIEWS[st.aba]) showTab(st.aba);
  if(typeof st.y==='number') requestAnimationFrame(()=>window.scrollTo(0,st.y));
}

/* Regenera o documento inteiro a partir das fontes originais — nunca do DOM
   vivo, que carrega estado de sessão e os scripts injetados pelo hospedeiro. */
function seguro(txt){ return String(txt).replace(/<\/(script|template)/gi,'<\\/$1'); }
function documentoCompleto(){
  const css=document.getElementById('app-css').textContent;
  const shell=document.getElementById('app-shell');
  const vendor=document.getElementById('app-vendor').textContent;
  const app=document.getElementById('app-js').textContent;
  if(!shell) throw {code:'invalid_content',message:'esqueleto ausente'};
  return '<!doctype html>\n<html lang="pt-BR">\n<head>\n'
    +'<meta charset="UTF-8">\n'
    +'<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    +'<title>Finanças</title>\n'
    +'<link rel="preconnect" href="https://fonts.googleapis.com">\n'
    +'<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
    +'<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">\n'
    +'<style id="app-css">'+css+'</style>\n'
    +'</head>\n<body>\n'
    +'<script id="app-dados" type="application/json">'+seguro(JSON.stringify(DB))+'<\/script>\n'
    +shell.innerHTML+'\n'
    +'<template id="app-shell">'+shell.innerHTML+'<\/template>\n'
    +'<script id="app-vendor">'+vendor+'<\/script>\n'
    +'<script id="app-js">'+app+'<\/script>\n'
    +'</body>\n</html>\n';
}
function migrateDB(){
  if(!DB.entradas_fixas) DB.entradas_fixas=[];
  if(!DB.categorias) DB.categorias=defaultCategorias();
  if(DB.metaPoupanca===undefined) DB.metaPoupanca=null;
  // add alocacao to savings that don't have it
  (DB.savings||[]).forEach(s=>{ if(!s.alocacao) s.alocacao='reserva'; });
}
function monthsBetween(isoA,isoB){ const a=new Date(isoA+'T12:00:00'),b=new Date(isoB+'T12:00:00'); return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()); }
function advanceCyclesIfNeeded(){
  const curLast=cycleRangeByOffset(0).last;
  if(DB.cycleAnchor){
    const passed=monthsBetween(DB.cycleAnchor,curLast);
    if(passed>0){
      (DB.parceladas||[]).forEach(p=>{
        p.parcela_atual=Number(p.parcela_atual)+passed;
        if(p.parcela_atual>Number(p.total_parcelas)) p.ativo=false;
      });
    }
  }
  DB.cycleAnchor=curLast;
}

const getFixas=()=>DB.fixas;
const getParceladas=()=>DB.parceladas;
const getTransacoes=()=>DB.transacoes;
const getSummary=()=>DB.monthly_summary;
const getSavings=()=>DB.savings;
const getEntradasFixas=()=>(DB.entradas_fixas||[]);
const getCategorias=()=>(DB.categorias||[]);

/* ============ HELPERS ============ */
function brl(v){ if(v===null||v===undefined||v==='') return '—'; return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fdate(d){ return new Date(d+'T12:00:00').toLocaleDateString('pt-BR'); }
function todayISO(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
function iso(y,m,d){ return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function moneyMaskInput(el){ let d=el.value.replace(/\D/g,''); if(!d){ el.value=''; return; } d=String(parseInt(d,10)); while(d.length<3) d='0'+d; el.value=Number(d.slice(0,-2)).toLocaleString('pt-BR')+','+d.slice(-2); }
function parseMoeda(s){ if(s==null||s==='') return NaN; return parseFloat(String(s).replace(/\./g,'').replace(',','.').replace(/[^\d.]/g,'')); }
function moedaToInput(v){ return v==null?'':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let flashId=null;
function clearFlash(){ flashId=null; }
function flashCls(id){ return id===flashId?' row-new':''; }

/* ============ CYCLE MATH ============ */
/* O ciclo financeiro não é o mês do calendário: vai do dia 21 ao dia 20 do
   mês seguinte. Os dois valores ficam aqui para não haver dia solto ou
   contado duas vezes se o ciclo mudar de novo. */
const CICLO_INICIO=21, CICLO_FIM=20;
function cycleRangeByOffset(offset){
  const n=new Date();
  const endM=n.getMonth()+(n.getDate()>=CICLO_INICIO?1:0)+offset;
  const end=new Date(n.getFullYear(),endM,CICLO_FIM);
  const start=new Date(n.getFullYear(),endM-1,CICLO_INICIO);
  return { first:iso(start.getFullYear(),start.getMonth()+1,start.getDate()),
           last: iso(end.getFullYear(),end.getMonth()+1,end.getDate()) };
}
function currentCycleRange(){ return cycleRangeByOffset(0); }
let cycleOffset=0;
function selectedCycleRange(){ return cycleRangeByOffset(cycleOffset); }
function changeCycle(delta){ cycleOffset+=delta; refresh('inicio','lancamentos','mensal','visao'); }
function resetCycle(){ if(cycleOffset!==0){ cycleOffset=0; refresh('inicio','lancamentos','mensal','visao'); } }
function cycleLabel(offset){
  const {first,last}=cycleRangeByOffset(offset);
  const f=new Date(first+'T12:00:00'),l=new Date(last+'T12:00:00');
  const dd=x=>String(x.getDate()).padStart(2,'0');
  const MM=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return dd(f)+'/'+MM[f.getMonth()]+' – '+dd(l)+'/'+MM[l.getMonth()];
}
function cycleSelectorHTML(){
  const tag=cycleOffset===0?'Ciclo atual':(cycleOffset<0?'Ciclo passado':'Ciclo futuro');
  return '<div style="margin-bottom:14px"><div class="cycle-sel">'
    +'<button onclick="changeCycle(-1)">‹</button>'
    +'<div class="cycle-mid" onclick="resetCycle()"><div class="cycle-range">'+cycleLabel(cycleOffset)+'</div><div class="cycle-tag">'+tag+'</div></div>'
    +'<button onclick="changeCycle(1)">›</button>'
    +'</div></div>';
}
function daysRemainingInCycle(){
  const {last}=currentCycleRange();
  const t=new Date(todayISO()+'T12:00:00'),l=new Date(last+'T12:00:00');
  return Math.max(1,Math.floor((l-t)/86400000)+1);
}
function inCurrentCycle(d){ const {first,last}=currentCycleRange(); return d>=first&&d<=last; }

/* ============ FINANCE CALCULATIONS ============ */
function recurringEvents(offset){
  const {first,last}=cycleRangeByOffset(offset);
  const dateForDom=dom=>{
    let d=new Date(first+'T12:00:00'); const end=new Date(last+'T12:00:00');
    while(d<=end){ if(d.getDate()===dom) return iso(d.getFullYear(),d.getMonth()+1,d.getDate()); d=new Date(d.getTime()+86400000); }
    return first;
  };
  const evs=[];
  getFixas().filter(f=>f.ativo&&f.nome!=='Cartão').forEach(f=>
    evs.push({tipo:'saida',origem:'fixa',nome:f.nome,valor:f.valor,data:dateForDom(f.dia_vencimento||1)}));
  getEntradasFixas().filter(f=>f.ativo).forEach(f=>
    evs.push({tipo:'entrada',origem:'entrada_fixa',nome:f.nome,valor:f.valor,data:dateForDom(f.dia_recebimento||1)}));
  getParceladas().forEach(p=>{
    const n=Number(p.parcela_atual)+offset;
    if(p.ativo!==false&&n>=1&&n<=Number(p.total_parcelas))
      evs.push({tipo:'saida',origem:'parcela',nome:p.nome,valor:p.valor_parcela,parcelaNum:n,total:Number(p.total_parcelas),data:dateForDom(CICLO_FIM)});
  });
  return evs;
}
function calcSaldoForCycle(offset){
  const {first,last}=cycleRangeByOffset(offset);
  let s=0;
  getTransacoes().forEach(t=>{ if(t.data>=first&&t.data<=last) s+=(t.tipo==='entrada'?t.valor:-t.valor); });
  recurringEvents(offset).forEach(e=>s+=(e.tipo==='entrada'?e.valor:-e.valor));
  return s;
}
function calcSaldo(){ return calcSaldoForCycle(0); }

/* ── 50/30/20 helpers ── */
function get5020Data(){
  const ano=new Date().getFullYear(), mes=new Date().getMonth()+1;
  const summ=getSummary().find(m=>m.mes===mes&&m.ano===ano);
  const income=summ?.entrada_total || getEntradasFixas().filter(f=>f.ativo).reduce((s,f)=>s+f.valor,0);
  if(!income) return null;
  const rec=recurringEvents(0);
  const essencial=rec.filter(e=>e.tipo==='saida').reduce((s,e)=>s+e.valor,0);
  const {first,last}=currentCycleRange();
  const estilo=getTransacoes().filter(t=>t.tipo==='saida'&&t.data>=first&&t.data<=last).reduce((s,t)=>s+t.valor,0);
  const poupanca=summ?.economizado||0;
  return {income,essencial,estilo,poupanca};
}

/* ── Runway helper ── */
function calcRunway(){
  const total=getSavings().reduce((s,m)=>s+(m.tipo==='aporte'?m.valor:-m.valor),0);
  const monthly=getFixas().filter(f=>f.ativo&&f.nome!=='Cartão').reduce((s,f)=>s+f.valor,0)
    +getParceladas().filter(p=>p.ativo).reduce((s,p)=>s+p.valor_parcela,0);
  if(!monthly) return null;
  return {total,monthly,months:total/monthly};
}

/* ============ TOKENS DE COR PARA OS GRÁFICOS ============ */
function tok(name,fallback){
  const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v||fallback;
}
function vizColors(){
  return {s1:tok('--series-1','#6D4AFF'),s2:tok('--series-2','#EB6834'),
          s3:tok('--series-3','#0E9F6E'),s4:tok('--series-4','#C98500'),
          pos:tok('--pos','#0E7C5A'),neg:tok('--neg','#D93B3B'),warn:tok('--warn','#C98500'),
          text2:tok('--text2','#6B6880'),border:tok('--border','#E9E8EF')};
}
function hexA(hex,a){
  const h=hex.replace('#','');
  const n=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const r=parseInt(n.slice(0,2),16),g=parseInt(n.slice(2,4),16),b=parseInt(n.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

const RENDER={inicio:renderInicio,lancamentos:renderLancamentos,mensal:renderMensal,fixas:renderFixas,
  parceladas:renderParceladas,categorias:renderCategorias,patrimonio:renderPatrimonio,resumo:renderResumo,visao:renderVisao};
const VIEW_TAB={inicio:'inicio',lancamentos:'lancamentos',mensal:'mensal',fixas:'planejamento',
  parceladas:'planejamento',categorias:'planejamento',patrimonio:'patrimonio',resumo:'analise',visao:'analise'};
const TAB_VIEWS={inicio:['inicio'],lancamentos:['lancamentos'],mensal:['mensal'],planejamento:['fixas','parceladas','categorias'],
  patrimonio:['patrimonio'],analise:['resumo','visao']};
const ALL_VIEWS=Object.keys(RENDER);
let activeTab='inicio';
let dirty=new Set();
const scrollPos={};

function renderView(name){ RENDER[name](); dirty.delete(name); }
function refresh(...names){ names.forEach(n=>{ if(VIEW_TAB[n]===activeTab) renderView(n); else dirty.add(n); }); }
function renderAll(){ dirty=new Set(ALL_VIEWS); TAB_VIEWS[activeTab].forEach(renderView); }

function showTab(tab){
  if(tab===activeTab){ window.scrollTo(0,0); return; }
  scrollPos[activeTab]=window.scrollY;
  activeTab=tab;
  document.querySelectorAll('.sb-nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  TAB_VIEWS[tab].forEach(n=>{ if(dirty.has(n)) renderView(n); });
  window.scrollTo(0,scrollPos[tab]||0);
  closeSidebar();
}
function showSub(tab,sub){
  const sec=document.getElementById('tab-'+tab);
  sec.querySelectorAll('.subnav button').forEach(b=>b.classList.toggle('active',b.dataset.sub===sub));
  sec.querySelectorAll('.subview').forEach(v=>v.classList.remove('active'));
  document.getElementById('sub-'+sub).classList.add('active');
  if(sub==='resumo'||dirty.has(sub)) renderView(sub);
}

/* ============ RENDER: DASHBOARD ============ */
function renderInicio(){
  const el=document.getElementById('tab-inicio');

  if(cycleOffset!==0){
    const {first,last}=selectedCycleRange();
    const saldo=calcSaldoForCycle(cycleOffset);
    let entradas=0,saidas=0;
    getTransacoes().forEach(t=>{ if(t.data>=first&&t.data<=last){ if(t.tipo==='entrada')entradas+=t.valor; else saidas+=t.valor; } });
    recurringEvents(cycleOffset).forEach(e=>{ if(e.tipo==='entrada')entradas+=e.valor; else saidas+=e.valor; });
    el.innerHTML=`
      ${cycleSelectorHTML()}
      <div class="card-dark"><div style="font-size:12px;opacity:.7;margin-bottom:4px">SALDO DO CICLO</div>
        <div style="font-size:44px;font-weight:800;color:${saldo>=0?'var(--pos)':'var(--neg)'}">${brl(saldo)}</div>
        <div style="font-size:12px;opacity:.6;margin-top:4px">${cycleOffset<0?'Ciclo encerrado':'Ciclo futuro · projeção pelas recorrentes'}</div>
      </div>
      <div class="dash-grid3">
        <div class="stat-card"><div class="sc-label">Entradas</div><div class="sc-val pos">${brl(entradas)}</div></div>
        <div class="stat-card"><div class="sc-label">Saídas</div><div class="sc-val neg">${brl(saidas)}</div></div>
        <div class="stat-card"><div class="sc-label">Saldo</div><div class="sc-val ${saldo>=0?'pos':'neg'}">${brl(saldo)}</div></div>
      </div>
      <button class="btn-add" onclick="openTxModal()">+ Lançar Gasto</button>
    `;
    return;
  }

  const saldo=calcSaldo(), dias=daysRemainingInCycle(), possoGastar=saldo/dias;
  const gastoHoje=getTransacoes().filter(t=>t.tipo==='saida'&&t.data===todayISO()).reduce((s,t)=>s+t.valor,0);
  let pct,gcolor;
  const VC=vizColors();
  if(possoGastar<=0){pct=100;gcolor=VC.neg;}
  else{pct=Math.min(100,Math.round(gastoHoje/possoGastar*100));gcolor=pct>=100?VC.neg:(pct>=80?VC.warn:VC.pos);}
  const C=2*Math.PI*48, off=(C*(1-Math.min(pct,100)/100)).toFixed(1);
  const {first}=currentCycleRange();
  const elapsed=Math.max(1,Math.floor((new Date(todayISO()+'T12:00:00')-new Date(first+'T12:00:00'))/86400000)+1);
  const saidasAteHoje=getTransacoes().filter(t=>t.tipo==='saida'&&t.data>=first&&t.data<=todayISO()).reduce((s,t)=>s+t.valor,0);
  const projecao=saldo-(saidasAteHoje/elapsed)*Math.max(0,dias-1);

  // 50/30/20
  const d5020=get5020Data();
  let block5020='';
  if(d5020){
    const {income,essencial,estilo,poupanca}=d5020;
    const mkBar=(label,val,target,color)=>{
      const actual=Math.round(val/income*100);
      const targetPx=Math.min(100,target);
      const fillW=Math.min(100,actual);
      const over=actual>target;
      return `<div class="rule-row">
        <div class="rule-labels"><span class="rl-name">${label}</span><span class="rl-pct">${brl(val)} · <b style="color:${over?'var(--neg)':'var(--pos)'}">${actual}%</b> <span style="color:var(--text2)">/ meta ${target}%</span></span></div>
        <div class="rule-bar"><div class="rule-bar-fill" style="width:${fillW}%;background:${over?'var(--neg)':color}"></div><div class="rule-target" style="left:${targetPx}%"></div></div>
        <div class="rule-note">${over?'⚠️ Acima do limite':'✓ Dentro do limite'}</div>
      </div>`;
    };
    block5020=`<div class="card">
      <div class="section-head" style="margin-top:0"><span class="section-title">Regra 50/30/20</span><span class="muted" style="font-size:11px">Base: ${brl(income)}</span></div>
      ${mkBar('Essencial (fixas + parcelas)',essencial,50,'var(--accent)')}
      ${mkBar('Estilo de vida (gastos avulsos)',estilo,30,'var(--series-2)')}
      ${mkBar('Poupança',poupanca,20,'var(--pos)')}
    </div>`;
  } else {
    block5020=`<div class="card"><p style="font-size:13px;color:var(--text2)">Cadastre a entrada mensal em <b>Análise → Resumo</b> para ver a Regra 50/30/20.</p></div>`;
  }

  el.innerHTML=`
    ${cycleSelectorHTML()}
    <div class="dash-grid">
      <div class="hero-card">
        <div class="gauge-wrap">
          <svg viewBox="0 0 112 112"><circle class="gauge-bg" cx="56" cy="56" r="48"></circle><circle class="gauge-fg" cx="56" cy="56" r="48" style="stroke:${gcolor};stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${off}"></circle></svg>
          <div class="gauge-center"><div class="gauge-pct">${pct}%</div><div class="gauge-cap">hoje</div></div>
        </div>
        <div class="hero-text">
          <div class="ht-label">Posso gastar hoje</div>
          <div class="ht-val" style="color:${possoGastar>=0?'var(--pos)':'var(--neg)'}">${brl(possoGastar)}</div>
          <div class="ht-sub">Gasto hoje ${brl(gastoHoje)} · ${dias} dia${dias!==1?'s':''} restante${dias!==1?'s':''}</div>
        </div>
      </div>
      <div class="dash-side">
        <div class="stat-card"><div class="sc-label">Saldo do ciclo</div><div class="sc-val ${saldo>=0?'pos':'neg'}">${brl(saldo)}</div></div>
        <div class="stat-card"><div class="sc-label">Projeção fim do ciclo</div><div class="sc-val ${projecao>=0?'pos':'neg'}">${brl(projecao)}</div><div class="sc-sub">no ritmo atual</div></div>
      </div>
    </div>
    ${block5020}
    <button class="btn-add" onclick="openTxModal()">+ Lançar Gasto</button>
  `;
}

function renderLancList(){
  const {first,last}=selectedCycleRange();
  const q=lancFilter.q.trim().toLowerCase();
  let tx=getTransacoes().filter(t=>t.data>=first&&t.data<=last);
  if(lancFilter.tipo) tx=tx.filter(t=>t.tipo===lancFilter.tipo);
  if(lancFilter.forma) tx=tx.filter(t=>t.forma_pagamento===lancFilter.forma);
  if(lancFilter.cat) tx=tx.filter(t=>(t.categoria||'')===lancFilter.cat);
  if(q) tx=tx.filter(t=>((t.descricao||'')+' '+(t.categoria||'')).toLowerCase().includes(q));
  tx=tx.slice().sort((a,b)=>b.data.localeCompare(a.data));
  const entradas=tx.filter(t=>t.tipo==='entrada').reduce((s,t)=>s+t.valor,0);
  const saidas=tx.filter(t=>t.tipo==='saida').reduce((s,t)=>s+t.valor,0);
  let rows=tx.map(t=>{
    const dd=fdate(t.data).slice(0,5);
    const icon=t.forma_pagamento==='cartao'?'💳':'💵';
    const desc=t.descricao?escapeHtml(t.descricao):'<span class="muted">Sem descrição</span>';
    return `<div class="row${flashCls(t.id)}" onclick="openTxModal('${t.id}')">
      <div class="rm"><div class="rname">${dd} · ${desc}</div>
        <div class="rsub"><span class="tag tag-gray">${escapeHtml(t.categoria||'—')}</span> ${icon}</div></div>
      <div class="rval ${t.tipo==='entrada'?'pos':'neg'}">${t.tipo==='entrada'?'+':'−'}${brl(t.valor)}</div>
      <button class="del" onclick="event.stopPropagation();delTx('${t.id}',event)">🗑</button>
    </div>`;
  }).join('');
  if(!tx.length) rows='<div class="empty">Nenhum lançamento encontrado.</div>';
  document.getElementById('lanc-list').innerHTML=`
    <div class="card"><div class="row-between" style="font-size:13px;font-weight:600"><span class="pos">Entradas: ${brl(entradas)}</span><span class="neg">Saídas: ${brl(saidas)}</span></div></div>
    <div class="card">${rows}</div>
  `;
}

   o que foi lançado com descrição/categoria pela aba Lançamentos entra na
   conta, mas não é sobrescrito aqui. Recorrentes (fixas, parcelas, salário)
   são derivados do Planejamento e aparecem travados. */
const DIA_SEM=['dom','seg','ter','qua','qui','sex','sáb'];

function txDoDia(dia,tipo){ return getTransacoes().filter(t=>t.data===dia&&t.tipo===tipo); }
function manualDia(dia,tipo){ return txDoDia(dia,tipo).reduce((a,t)=>a+t.valor,0); }
function detalhadoDia(dia,tipo){ return txDoDia(dia,tipo).filter(t=>t.origem!=='grade').reduce((a,t)=>a+t.valor,0); }
function gradeTx(dia,tipo){ return getTransacoes().find(t=>t.data===dia&&t.tipo===tipo&&t.origem==='grade'); }
function fixoDia(evs,dia,tipo){ return evs.filter(e=>e.data===dia&&e.tipo===tipo).reduce((a,e)=>a+e.valor,0); }

/* Recalcula saldos e totais sem redesenhar a tabela — assim o foco e a
   posição do cursor sobrevivem à digitação. */
function recalcMensal(){
  const el=document.getElementById('tab-mensal');
  const corpo=el&&el.querySelector('.mg-tabela'); if(!corpo) return;
  const evs=recurringEvents(cycleOffset);
  let acc=0,totE=0,totS=0;
  el.querySelectorAll('.mg-row').forEach(tr=>{
    const dia=tr.dataset.dia;
    const e=manualDia(dia,'entrada')+fixoDia(evs,dia,'entrada');
    const sa=manualDia(dia,'saida')+fixoDia(evs,dia,'saida');
    acc+=e-sa; totE+=e; totS+=sa;
    const cel=tr.querySelector('.mg-saldo');
    cel.textContent=brl(acc);
    cel.className='mg-saldo '+(acc>0?'pos':(acc<0?'neg':'muted'));
    tr.querySelectorAll('.mg-in').forEach(inp=>{
      if(inp===document.activeElement) return;
      const v=manualDia(dia,inp.dataset.tipo);
      inp.value=v?moedaToInput(v):'';
      inp.classList.toggle('has-val',!!v);
    });
  });
  const set=(id,txt,cls)=>{ const n=document.getElementById(id); if(n){ n.textContent=txt; if(cls) n.className='sc-val '+cls; } };
  set('mg-tot-ent',brl(totE)); set('mg-tot-sai',brl(totS));
  set('mg-tot-sal',brl(totE-totS),(totE-totS)>0?'pos':((totE-totS)<0?'neg':'muted'));
}

function setGradeCel(inp){
  const dia=inp.dataset.dia, tipo=inp.dataset.tipo;
  const v=parseMoeda(inp.value);
  const alvo=isNaN(v)?0:v;
  const det=detalhadoDia(dia,tipo);
  const resto=alvo-det;
  if(resto<0){
    toast('Esse dia já tem '+brl(det)+' lançado em detalhe');
    inp.blur(); recalcMensal(); return;
  }
  const ex=gradeTx(dia,tipo);
  if(resto===0){ if(ex) DB.transacoes=DB.transacoes.filter(t=>t.id!==ex.id); }
  else if(ex){ ex.valor=resto; }
  else DB.transacoes.push({id:uid(),data:dia,tipo,valor:resto,descricao:'',categoria:'',
                           forma_pagamento:'dinheiro_pix',origem:'grade'});
  saveDB();
  inp.classList.toggle('has-val',alvo>0);
  refresh('inicio','lancamentos','visao');
  recalcMensal();
}

/* Enter/setas andam pela coluna, como numa planilha. */
function gradeTecla(ev,inp){
  const passo=ev.key==='Enter'||ev.key==='ArrowDown'?1:(ev.key==='ArrowUp'?-1:0);
  if(!passo) return;
  ev.preventDefault();
  const iguais=[...document.querySelectorAll('.mg-in[data-tipo="'+inp.dataset.tipo+'"]')];
  const alvo=iguais[iguais.indexOf(inp)+passo];
  if(alvo){ alvo.focus(); alvo.select(); }
}

/* ============ RENDER: VISÃO GERAL ============ */
function renderVisao(){
  const el=document.getElementById('sub-visao');
  const {first,last}=selectedCycleRange(), today_=todayISO();
  const days=[]; let d=new Date(first+'T12:00:00'); const endD=new Date(last+'T12:00:00');
  while(d<=endD){ days.push(iso(d.getFullYear(),d.getMonth()+1,d.getDate())); d=new Date(d.getTime()+86400000); }
  const txs=getTransacoes().filter(t=>t.data>=first&&t.data<=last);
  const evs=recurringEvents(cycleOffset);
  const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const fmtDay=iso_=>{ const dt=new Date(iso_+'T12:00:00'); return String(dt.getDate()).padStart(2,'0')+' '+MESES[dt.getMonth()]; };
  let totalIn=0, totalOut=0;
  const byDay=days.map(isoDay=>{
    const inTx=txs.filter(t=>t.data===isoDay&&t.tipo==='entrada');
    const outTx=txs.filter(t=>t.data===isoDay&&t.tipo==='saida');
    const evDay=evs.filter(e=>e.data===isoDay);
    return {isoDay,inTx,outTx,evIn:evDay.filter(e=>e.tipo==='entrada'),evOut:evDay.filter(e=>e.tipo==='saida')};
  }).filter(x=>x.inTx.length||x.outTx.length||x.evIn.length||x.evOut.length);
  const rows=byDay.map(x=>{
    const sumIn=x.inTx.reduce((s,t)=>s+t.valor,0)+x.evIn.reduce((s,e)=>s+e.valor,0);
    const sumOut=x.outTx.reduce((s,t)=>s+t.valor,0)+x.evOut.reduce((s,e)=>s+e.valor,0);
    totalIn+=sumIn; totalOut+=sumOut;
    const isToday=x.isoDay===today_;
    const inLines=[
      ...x.inTx.map(t=>`<div class="vg-item pos">↑ ${escapeHtml(t.descricao||'Entrada')} <b>${brl(t.valor)}</b></div>`),
      ...x.evIn.map(e=>`<div class="vg-item pos">💰 ${escapeHtml(e.nome)} (fixa) <b>${brl(e.valor)}</b></div>`)
    ].join('');
    const outLines=[
      ...x.outTx.map(t=>`<div class="vg-item neg">↓ ${escapeHtml(t.descricao||t.categoria||'Gasto')} ${t.forma_pagamento==='cartao'?'💳':'💵'} <b>${brl(t.valor)}</b></div>`),
      ...x.evOut.map(e=>e.origem==='parcela'
        ?`<div class="vg-item neg">💳 ${escapeHtml(e.nome)} <span class="tag tag-blue">${e.parcelaNum}/${e.total}</span> <b>${brl(e.valor)}</b></div>`
        :`<div class="vg-item neg">📌 ${escapeHtml(e.nome)} <b>${brl(e.valor)}</b></div>`)
    ].join('');
    return `<div class="vg-day${isToday?' vg-today':''}">
      <div class="vg-header">
        <span class="vg-date">${fmtDay(x.isoDay)}${isToday?' <span class="tag tag-accent">Hoje</span>':''}</span>
        <span class="vg-totals">${sumIn?`<span class="pos">+${brl(sumIn)}</span>`:''}${sumOut?`<span class="neg">−${brl(sumOut)}</span>`:''}</span>
      </div>
      <div class="vg-body">${inLines}${outLines}</div>
    </div>`;
  }).join('');
  el.innerHTML=`${cycleSelectorHTML()}
    <div class="card" style="margin-bottom:14px">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center">
        <div><div style="font-size:11px;color:var(--text2)">Entradas</div><div style="font-weight:800;font-size:16px" class="pos">${brl(totalIn)}</div></div>
        <div><div style="font-size:11px;color:var(--text2)">Saídas</div><div style="font-weight:800;font-size:16px" class="neg">${brl(totalOut)}</div></div>
        <div><div style="font-size:11px;color:var(--text2)">Saldo</div><div style="font-weight:800;font-size:16px" class="${totalIn-totalOut>=0?'pos':'neg'}">${brl(totalIn-totalOut)}</div></div>
      </div>
    </div>
    ${byDay.length===0?'<div class="empty">Nenhum evento neste ciclo.</div>':rows}`;
}

/* ============ SOFT DELETE ============ */
function softDelete(coll,id,views,label){
  const arr=DB[coll]; const idx=arr.findIndex(x=>x.id===id);
  if(idx<0) return;
  const item=arr[idx]; arr.splice(idx,1); saveDB(); refresh(...views);
  showUndo(label+' excluído',()=>{ DB[coll].splice(Math.min(idx,DB[coll].length),0,item); saveDB(); refresh(...views); });
}
function animThenDelete(ev,fn){
  const row=ev?.target?.closest?.('.row');
  if(row){ row.classList.add('leaving'); setTimeout(fn,180); } else fn();
}

/* ============ TOAST ============ */
let toastTimer=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }
function showUndo(msg,undoFn){
  const t=document.getElementById('toast');
  t.innerHTML='<span>'+escapeHtml(msg)+'</span><button class="toast-undo" onclick="this.closest(\'#toast\').classList.remove(\'show\')">Desfazer</button>';
  t.classList.add('show');
  t.querySelector('.toast-undo').onclick=()=>{ t.classList.remove('show'); undoFn(); setTimeout(()=>toast('Restaurado'),220); };
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),5000);
}

/* ============ TEMA ============ */
function currentTheme(){
  const s=localStorage.getItem('theme');
  if(s) return s;
  // Sem preferência salva: segue o tema que o hospedeiro carimbou (Artifact) ...
  const host=document.documentElement.getAttribute('data-theme');
  if(host==='dark'||host==='light') return host;
  // ... ou, na falta dele, o tema do sistema.
  return window.matchMedia?.('(prefers-color-scheme:dark)').matches?'dark':'light';
}
function applyChartTheme(t){
  if(!window.Chart) return;
  Chart.defaults.font.family="'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif";
  Chart.defaults.color=tok('--text2',t==='dark'?'#9490A8':'#6B6880');
  Chart.defaults.borderColor=tok('--border',t==='dark'?'#2A2637':'#E9E8EF');
}
function applyTheme(){
  const t=currentTheme();
  // Só carimba data-theme quando o usuário escolheu: sem escolha, preserva o
  // que o hospedeiro definiu em vez de apagá-lo.
  if(localStorage.getItem('theme')) document.documentElement.setAttribute('data-theme',t);
  const icon=t==='dark'?'☀️ Tema':'🌙 Tema';
  document.querySelectorAll('#btn-theme,#btn-theme-mob').forEach(b=>{ if(b) b.textContent=t==='dark'?'☀️':'🌙'; });
  const sb=document.getElementById('btn-theme'); if(sb) sb.textContent=icon;
  applyChartTheme(t);
}
function toggleTheme(){ localStorage.setItem('theme',currentTheme()==='dark'?'light':'dark'); applyTheme(); refresh('patrimonio','resumo'); }

/* ============ BACKUP ============ */
/* Publicado como Artifact, a página roda num frame que não baixa arquivos
   sozinho: o download passa pela capability `downloads`, que pede
   confirmação ao usuário. Aberto como arquivo solto, o link comum resolve. */
/* Checagem preguiçosa: o hospedeiro pode injetar window.claude depois que
   este script roda, então não dá para congelar isso numa constante. */
function rodandoNoArtifact(){ return typeof window.claude?.use === 'function'; }
let capDownloads;
async function getDownloads(){
  if(!rodandoNoArtifact()) return null;
  if(capDownloads!==undefined) return capDownloads;
  try{ capDownloads = await window.claude.use('downloads'); }
  catch(e){ capDownloads = null; }
  return capDownloads;
}

function baixaPorLink(filename,content,mime){
  const url=URL.createObjectURL(new Blob([content],{type:mime}));
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function salvaArquivo(filename,content,mime){
  if(!rodandoNoArtifact()){ baixaPorLink(filename,content,mime); toast('Arquivo baixado'); return; }
  const dl=await getDownloads();
  if(!dl){ toast('Download indisponível aqui — use "Copiar backup"'); return; }
  try{
    await dl.save({filename,data:content});
    toast('Arquivo salvo');
  }catch(e){
    const cod=e&&e.code;
    if(cod==='extension_not_enabled'&&filename.endsWith('.csv')){
      // .csv nem sempre está liberado; o mesmo conteúdo cabe num .txt
      try{ await dl.save({filename:filename.replace(/\.csv$/,'.txt'),data:content});
           toast('Salvo como .txt — .csv não é permitido aqui'); return; }
      catch(e2){ /* cai no tratamento abaixo */ }
    }
    if(cod==='declined') toast('Download cancelado');
    else if(cod==='too_large') toast('Arquivo grande demais para baixar');
    else if(cod==='rate_limited') toast('Espere um instante e tente de novo');
    else toast('Não foi possível baixar — use "Copiar backup"');
  }
}

function backupJSON(){ return JSON.stringify(DB,null,2); }
function exportJSON(){ salvaArquivo('financas-backup-'+todayISO()+'.json',backupJSON(),'application/json'); }
function csvEscape(v){ if(v==null) return ''; const s=String(v); return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function montaCSV(){
  const h=['data','tipo','valor','descricao','categoria','forma_pagamento'];
  const linhas=[h.join(';')];
  getTransacoes().slice().sort((a,b)=>a.data.localeCompare(b.data)).forEach(t=>{
    linhas.push([t.data,t.tipo,String(t.valor).replace('.',','),t.descricao,t.categoria,t.forma_pagamento].map(csvEscape).join(';'));
  });
  return '﻿'+linhas.join('\n');
}
function exportCSV(){ salvaArquivo('lancamentos-'+todayISO()+'.csv',montaCSV(),'text/csv;charset=utf-8'); }

async function copiarBackup(){
  try{ await navigator.clipboard.writeText(backupJSON()); toast('Backup copiado para a área de transferência'); }
  catch(e){ openModal(`<h3>Copiar backup</h3>
    <p class="aviso">Selecione tudo e copie (Ctrl/Cmd + A, depois Ctrl/Cmd + C).</p>
    <div class="field"><textarea readonly onclick="this.select()">${escapeHtml(backupJSON())}</textarea></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="openBackupModal()">Voltar</button></div>`); }
}

/* Confirmação em modal próprio: alert()/confirm() podem ser bloqueados
   dentro do frame do Artifact e sumiriam sem aviso. */
let acaoPendente=null;
function confirmarModal(titulo,corpoHTML,rotulo,fn,perigo){
  acaoPendente=fn;
  openModal(`<h3>${escapeHtml(titulo)}</h3>
    <div class="aviso">${corpoHTML}</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-accent"${perigo?' style="background:var(--neg)"':''} onclick="rodarAcaoPendente()">${escapeHtml(rotulo)}</button>
    </div>`);
}
function rodarAcaoPendente(){ const f=acaoPendente; acaoPendente=null; closeModal(); if(f) f(); }

function aplicaBackup(texto){
  let data;
  try{ data=JSON.parse(texto); }
  catch(e){ toast('Não é um JSON válido'); return; }
  const cols=['fixas','parceladas','transacoes','monthly_summary','savings','entradas_fixas'];
  if(typeof data!=='object'||data===null||!cols.some(k=>Array.isArray(data[k]))){
    toast('Não parece um backup do Finanças'); return;
  }
  confirmarModal('Importar backup',
    'Isto substitui todos os dados atuais por:<br><b>'+((data.transacoes||[]).length)+'</b> lançamentos · '
    +'<b>'+((data.fixas||[]).length)+'</b> contas fixas · '
    +'<b>'+((data.savings||[]).length)+'</b> movimentações de patrimônio.',
    'Importar', ()=>{
      DB={fixas:data.fixas||[],parceladas:data.parceladas||[],transacoes:data.transacoes||[],
        monthly_summary:data.monthly_summary||[],savings:data.savings||[],entradas_fixas:data.entradas_fixas||[],
        categorias:data.categorias||defaultCategorias(),metaPoupanca:data.metaPoupanca??null};
      if(data.cycleAnchor) DB.cycleAnchor=data.cycleAnchor;
      migrateDB(); saveDB(); renderAll(); toast('Backup importado');
    });
}

function importJSON(){
  const input=document.createElement('input');
  input.type='file'; input.accept='application/json,.json';
  input.onchange=()=>{
    const file=input.files&&input.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>aplicaBackup(String(reader.result));
    reader.onerror=()=>toast('Não foi possível ler o arquivo');
    reader.readAsText(file);
  };
  input.click();
}

function openColarModal(){
  openModal(`<h3>Colar backup</h3>
    <p class="aviso">Abra o arquivo <b>.json</b> do backup, copie todo o conteúdo e cole aqui.
    Serve para trazer os dados de outro navegador ou da versão em arquivo.</p>
    <div class="field"><textarea id="bk-txt" placeholder='{ "fixas": [ ... ] }' spellcheck="false"></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="openBackupModal()">Voltar</button>
      <button class="btn-accent" onclick="aplicaBackup(document.getElementById('bk-txt').value)">Importar</button>
    </div>`);
}

function recuperaLocal(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(!d){ toast('Nada guardado neste navegador'); return; }
  aplicaBackup(JSON.stringify(d));
}

function resetData(){
  confirmarModal('Resetar dados',
    'Todos os seus lançamentos, contas e movimentações serão apagados e os valores iniciais voltam. Não dá para desfazer.',
    'Apagar tudo', ()=>{ DB=seed(); saveDB(); renderAll(); toast('Dados restaurados'); }, true);
}

async function openBackupModal(){
  const podeBaixar = !rodandoNoArtifact() || !!(await getDownloads());
  // Dados de antes da migração podem ter ficado presos neste navegador.
  let localAntigo=null;
  if(modoArtifact){
    try{
      const raw=localStorage.getItem(KEY);
      const d=raw?JSON.parse(raw):null;
      if(d&&JSON.stringify(d)!==JSON.stringify(DB)) localAntigo=d;
    }catch(e){}
  }
  openModal(`<h3>Dados & Backup</h3>
    <p class="aviso">${modoArtifact
      ? 'Seus dados ficam salvos dentro deste artifact — acompanham o link em qualquer aparelho.'
      : 'Seus dados ficam guardados só neste navegador. Faça um backup de vez em quando.'}</p>
    ${podeBaixar?`
      <button class="btn-add btn-soft-pos" style="margin-bottom:8px" onclick="exportJSON()">⬇️ Exportar backup (.json)</button>
      <button class="btn-add btn-soft" style="margin-bottom:8px" onclick="exportCSV()">📄 Exportar lançamentos (.csv)</button>`:''}
    <button class="btn-add btn-soft" style="margin-bottom:8px" onclick="copiarBackup()">📋 Copiar backup</button>
    <button class="btn-add" style="background:var(--ink);box-shadow:none;margin-bottom:8px" onclick="importJSON()">⬆️ Importar arquivo (.json)</button>
    <button class="btn-add btn-soft" style="margin-bottom:8px" onclick="openColarModal()">📥 Colar backup</button>
    ${localAntigo?`<button class="btn-add btn-soft" style="margin-bottom:16px" onclick="recuperaLocal()">💾 Recuperar dados guardados neste navegador</button>`:'<div style="height:8px"></div>'}
    <button class="btn-add" style="background:var(--neg)" onclick="resetData()">🗑️ Resetar para dados iniciais</button>
    <div class="modal-actions" style="margin-top:12px"><button class="btn-cancel" onclick="closeModal()">Fechar</button></div>`);
}

/* ============ NAV ============ */
document.querySelectorAll('.sb-nav button').forEach(b=>{
  b.addEventListener('click',()=>showTab(b.dataset.tab));
});

/* ============ INIT ============ */
loadDB().then(()=>{
  applyTheme();
  renderAll();
  restauraEstadoUI();
  if(somenteLeitura) chip('erro','Somente leitura');
  else if(modoArtifact) chip('salvo','Salvo no artifact');
});
</script>
