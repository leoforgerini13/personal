# Publica o Mapa de Amsterdam (pasta amsterdam/) no GitHub Pages.
# Ative em Settings → Pages → Source: "GitHub Actions".
name: Mapa de Amsterdam → GitHub Pages

on:
  push:
    paths:
      - "amsterdam/**"
      - ".github/workflows/amsterdam-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Só roda na branch padrão do repositório (é de lá que o Pages publica).
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes do geocode
        run: python3 -m unittest amsterdam/scripts/test_geocode.py
      - name: Montar o site
        run: sh amsterdam/scripts/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: amsterdam/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
